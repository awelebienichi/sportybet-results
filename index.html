<style>
/* Layout: one narrow column of betting slips - totals first, then filters, then each ticket set as a stack of slips */
:root{
  --bg:#edf1ef; --card:#ffffff; --ink:#13201a; --muted:#5b6a62; --line:#d4ddd8; --soft:#f4f7f5;
  --code-bg:#ffe58a; --code-ink:#3a2e00; --code-line:#e2c044;
  --won:#16804a; --won-bg:#e2f3e9; --lost:#c0372d; --lost-bg:#fbe5e2; --run:#66757f; --run-bg:#e9eef1; --chk:#a87a0c; --chk-bg:#f8eecb; --void:#8a949b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --card:#151e1a; --ink:#e3ebe7; --muted:#97a69e; --line:#26322c; --soft:#1a2520;
  --code-bg:#4a3c06; --code-ink:#ffe69a; --code-line:#7d6710;
  --won:#45c07f; --won-bg:#16301f; --lost:#f06c60; --lost-bg:#3a1b18; --run:#a3b1ba; --run-bg:#24302b; --chk:#e0b43c; --chk-bg:#3a3210; --void:#7d8a93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --card:#151e1a; --ink:#e3ebe7; --muted:#97a69e; --line:#26322c; --soft:#1a2520;
  --code-bg:#4a3c06; --code-ink:#ffe69a; --code-line:#7d6710;
  --won:#45c07f; --won-bg:#16301f; --lost:#f06c60; --lost-bg:#3a1b18; --run:#a3b1ba; --run-bg:#24302b; --chk:#e0b43c; --chk-bg:#3a3210; --void:#7d8a93; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile:focus-visible,.chip:focus-visible,.set>summary:focus-visible,.slip>summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--code-line);outline-offset:2px}
.tile b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile.W b{color:var(--won)}.tile.L b{color:var(--lost)}.tile.R b{color:var(--run)}.tile.C b{color:var(--chk)}
.tile[aria-pressed="true"]{border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{flex:1 1 220px;min-width:0;font:inherit;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar input::placeholder{text-transform:none;font-family:var(--body);letter-spacing:0;color:var(--muted)}
.chip{font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:12px}
.set{background:var(--card);border:1px solid var(--line);border-radius:10px}
.set>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.set>summary::-webkit-details-marker{display:none}
.set-name{font-weight:600;font-size:15px}
.set-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set-meta .w{color:var(--won);font-weight:600}.set-meta .l{color:var(--lost);font-weight:600}.set-meta .r{color:var(--run);font-weight:600}
.set[open]>summary{border-bottom:1px solid var(--line)}
.slips{display:flex;flex-direction:column}
.slip{border-bottom:1px solid var(--line);border-left:4px solid var(--run)}
.slip:last-child{border-bottom:0;border-bottom-left-radius:10px;border-bottom-right-radius:10px}
.slip.W{border-left-color:var(--won)}.slip.L{border-left-color:var(--lost)}.slip.C{border-left-color:var(--chk)}
.slip>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:2.4em auto 1fr auto;gap:6px 10px;align-items:center}
.slip>summary::-webkit-details-marker{display:none}
.num{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.05em;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-line);border-radius:6px;padding:2px 8px}
.odds{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}.odds small{color:var(--muted);font-weight:400;margin-left:3px}
.pill{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;justify-self:end;white-space:nowrap}
.pill.W{background:var(--won);color:var(--card)}.pill.L{background:var(--lost);color:var(--card)}.pill.R{background:var(--run-bg);color:var(--ink)}.pill.C{background:var(--chk);color:var(--card)}
.legline{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:9px;height:9px;border-radius:2px;display:block;background:var(--line)}
.dots .w{background:var(--won)}.dots .l{background:var(--lost)}.dots .v{background:var(--void)}.dots .c{background:var(--chk)}
.legsum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legs{padding:0 12px 12px 12px;display:flex;flex-direction:column;gap:4px}
.tools{display:flex;gap:8px;padding:0 0 4px}
.tools button{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.leg{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:2px 10px;padding:7px 9px;border-radius:6px;background:var(--soft);font-size:13px}
.leg.w{background:var(--won-bg)}.leg.l{background:var(--lost-bg)}.leg.c{background:var(--chk-bg)}
.leg .t{color:var(--muted);font-variant-numeric:tabular-nums}
.leg .m{min-width:0}.leg .m b{font-weight:600}.leg .m div{color:var(--muted)}
.leg .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg .r b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.leg.w .r b{color:var(--won)}.leg.l .r b{color:var(--lost)}.leg.c .r b{color:var(--chk)}.leg.p .r b,.leg.v .r b{color:var(--muted)}
.live{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.live button{font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.live button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.live button[disabled]{opacity:.6;cursor:progress}
#livemsg{font-size:13px;color:var(--muted)}
.leg .r i{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--chk)}
.empty{color:var(--muted);padding:20px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.note{font-size:13px;color:var(--muted)}
.more{font:inherit;font-weight:600;padding:10px;border:0;background:var(--soft);color:var(--ink);cursor:pointer;border-bottom-left-radius:10px;border-bottom-right-radius:10px}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slip>summary{grid-template-columns:2em auto 1fr}
  .slip>summary .pill{grid-column:3;grid-row:1}
  .slip>summary .odds{grid-column:2/-1;grid-row:2}
  .legline{grid-row:3}
  .leg{grid-template-columns:minmax(0,1fr) auto}.leg .t{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.slip>summary,.tile,.chip{transition:background-color .15s,border-color .15s}}
</style>

<script>
(function(){

        });

  }

    allBtn.setAttribute('aria-pressed',String(!filt&&!term));

      var tk=s.t.filter(function(t){return (!filt||t[3]===filt)&&(!term||t[1].indexOf(term)>=0)});
      if(!tk.length)return;shown++;

  function pool(items,n,fn){var i=0,out=[];return new Promise(function(done){var busy=0;(function next(){

      D.sets.forEach(function(s){var c={};s.t.forEach(function(t){var k={w:0,l:0,p:0,c:0};t[4].forEach(function(g){k[g[6]]=(k[g[6]]||0)+1});
        t[3]=k.l?'L':(k.p?'R':(k.c?'C':'W'));c[t[3]]=(c[t[3]]||0)+1;tot[t[3]]++});s.c=c});
      D.tot=tot;Array.prototype.forEach.call(tilesEl.children,function(b){b.querySelector('b').textContent=(tot[b.dataset.k]||0).toLocaleString('en-US')});
      render();
      msg.textContent='Scores checked '+hhmm()+': '+r.fin.length+' finished'+(r.nlive?', '+r.nlive+' live now':'')+(r.nfail?', '+r.nfail+' could not be reached':'')+(r.nopy?' (results show at the next update)':'')+'.';
    }).catch(function(){msg.textContent='Could not reach the score service. Check your connection and try again.'})
      .then(function(){liveBtn.disabled=false});
  });
})();
</script>
