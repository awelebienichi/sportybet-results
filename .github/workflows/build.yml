name: Build tickets from phone
# An always-on listener: each run listens for build.html requests for ~5h45m (checking every few seconds) while
# keeping team stats warm. The schedule keeps one more run queued so the next takes over as soon as one ends.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: phone-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: builder/cache
          key: sr-${{ github.run_id }}
          restore-keys: sr-
      - name: Listen and build
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_TOKEN: ${{ github.token }}
          TZ: Africa/Lagos
          RUN_SECONDS: "20700"
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -u builder/listen.py
