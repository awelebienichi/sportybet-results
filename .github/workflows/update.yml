name: Update results
on:
  schedule:
    - cron: "7 */2 * * *"      # every 2 hours (GitHub may start it a few minutes late)
  workflow_dispatch:
  push:
    paths: ["tracker/tracker.json"]
concurrency:
  group: update-results
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check scores and rebuild the page
        run: |
          cd tracker
          python3 track.py check
          python3 web_page.py
          python3 build_site.py ..
      - name: Save results
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest icon.svg .nojekyll tracker/results.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Results $(TZ=Africa/Lagos date '+%a %d %b %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
