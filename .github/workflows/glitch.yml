name: odds glitch scanner (cloud backup)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test: { description: "send a test push to the phone", type: boolean, default: false }
concurrency: { group: glitch, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test push to phone
        if: ${{ inputs.test }}
        env: { NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}" }
        run: curl -s -H "Title: Cloud scanner connected" -H "Priority: urgent" -H "Tags: cloud" -d "Test from GitHub cloud - glitch alerts will reach you even when your Mac is off." "https://ntfy.sh/$NTFY_TOPIC" | head -c 120
      - name: Scan SportyBet once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCAN_HOME: ${{ github.workspace }}/glitch
          SITE: ${{ github.workspace }}
          SCAN_WHO: cloud
        run: |
          git config user.name "glitch-bot"; git config user.email "glitch-bot@users.noreply.github.com"
          python3 glitch/scan.py --once
